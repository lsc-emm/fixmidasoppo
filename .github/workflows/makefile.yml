name: Build midas_fix.ko with DDK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      ddk_image:
        description: 'DDK Docker image tag (需匹配设备内核日期)'
        required: false
        default: 'ghcr.io/ylarod/ddk-min:android12-5.10-20221204'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show DDK image
        run: |
          echo "使用镜像: ${{ inputs.ddk_image || 'ghcr.io/ylarod/ddk-min:android12-5.10-20221204' }}"

      - name: Build .ko with DDK Docker
        run: |
          IMAGE="${{ inputs.ddk_image || 'ghcr.io/ylarod/ddk-min:android12-5.10-20221204' }}"
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            "$IMAGE" \
            make

      - name: List build output
        run: |
          ls -lh *.ko || true
          file *.ko || true

      - name: Upload .ko artifact
        uses: actions/upload-artifact@v4
        with:
          name: midas_fix-ko
          path: "*.ko"
          if-no-files-found: error

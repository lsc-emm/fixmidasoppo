name: Build midas_fix.ko with DDK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      ddk_image:
        description: 'DDK镜像tag (默认20260828，失败可尝试2021-11)'
        required: false
        default: 'ghcr.io/ylarod/ddk-min:android12-5.10-20260828'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Build .ko with DDK Docker
        run: |
          IMAGE="${{ inputs.ddk_image || 'ghcr.io/ylarod/ddk-min:android12-5.10-20260828' }}"
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            "$IMAGE" \
            make

      - name: Upload .ko artifact
        uses: actions/upload-artifact@v4
        with:
          name: midas_fix-ko
          path: "*.ko"
          if-no-files-found: error
